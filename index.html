        :root {
            --bg: #0E1015;

            --border: #2A2D35;
            --text-main: #E2E2E2;
            --text-muted: #8A8F98;
            --accent: #5E6AD2;
            --accent-glow: rgba(94, 106, 210, 0.2);
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        body::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }
        .container {
            width: 100%;
            max-width: 1000px;
        }
        .header {
            margin-bottom: 30px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
        }
        .details-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .details-header {
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .task-item.completed {
            color: var(--text-main);
            text-decoration: line-through;
            opacity: 0.7;
        }
        .checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .task-item.completed .checkbox {
            background: var(--accent);
            border-color: var(--accent);
        }
        .task-item.completed .checkbox::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
        .empty-state {
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
        }
    
        .task-item.delayed {
            border-left: 2px solid #E8A838;
        }
        .delay-badge {
            display: inline-block;
            margin-left: 8px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(232, 168, 56, 0.15);
            color: #E8A838;
            font-weight: 600;
            vertical-align: middle;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }
        .range-selector {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
            gap: 3px;
        }
        .range-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .range-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
        }
        .range-btn.active {
            background: var(--accent);
            color: #FFFFFF;
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        </style>
</head>
<body>

<div class="container">

<script>
    if (typeof window.dashboardData === 'undefined') {
        document.getElementById('taskList').innerHTML = '<div class="empty-state">data.js not found. Wait for the background agent to generate it!</div>';
    } else {
        const fullData = window.dashboardData;
        let currentData = [];
        let currentRange = '15'; // default to last 15 days

        function getFilteredData(range) {
            if (range === '15') {
                return fullData.slice(-15);
            } else if (range === '30') {
                return fullData.slice(-30);
            } else {
                return fullData.slice(); // 'all' (so far)
            }
        }

        currentData = getFilteredData(currentRange);

        const ctx = document.getElementById('performanceChart').getContext('2d');
        
        let gradient = ctx.createLinearGradient(0, 0, 0, 350);
        gradient.addColorStop(0, 'rgba(94, 106, 210, 0.4)');
        gradient.addColorStop(1, 'rgba(94, 106, 210, 0.0)');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: currentData.map(d => d.date.substring(5)),
                datasets: [{
                    label: 'Completion Rate (%)',
                    data: currentData.map(d => d.planned > 0 ? Math.round((d.completed / d.planned) * 100) : 0),
                    borderColor: '#5E6AD2',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    pointBackgroundColor: '#171A21',
                    pointBorderColor: '#5E6AD2',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#171A21',
                        titleColor: '#E2E2E2',
                        bodyColor: '#8A8F98',
                        borderColor: '#2A2D35',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                const dayData = currentData[context.dataIndex];
                                return `Completed: ${dayData.completed} / ${dayData.planned} (${context.parsed.y}%)`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: '#2A2D35', drawBorder: false },
                        ticks: { color: '#8A8F98', callback: val => val + '%' }
                    },
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: { color: '#8A8F98' }
                    }
                },
                onHover: (event, elements) => {
                    if (elements.length > 0) {
                        event.native.target.style.cursor = 'pointer';
                        const index = elements[0].index;
                        if (currentData[index]) {
                            showDetails(currentData[index]);
                        }
                    } else {
                        event.native.target.style.cursor = 'default';
                    }
                },
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        if (currentData[index]) {
                            showDetails(currentData[index]);
                        }
                    }
                }
            }
        });

        function setRange(range) {
            currentRange = range;
            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === range);
            });
            currentData = getFilteredData(range);
            chart.data.labels = currentData.map(d => d.date.substring(5));
            chart.data.datasets[0].data = currentData.map(d => d.planned > 0 ? Math.round((d.completed / d.planned) * 100) : 0);
            chart.update();

            if (currentData.length > 0) {
                showDetails(currentData[currentData.length - 1]);
            }
        }

        document.querySelectorAll('.range-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setRange(btn.dataset.range);
            });
        });

        // Initialize with latest day selected
        if (currentData.length > 0) {
            showDetails(currentData[currentData.length - 1]);
        }

        function showDetails(dayData) {
            const panel = document.getElementById('taskPanel');
            const list = document.getElementById('taskList');
            
            document.getElementById('selectedDate').innerText = `Tasks for ${dayData.date}`;
            document.getElementById('selectedStats').innerText = `${dayData.completed} completed out of ${dayData.planned} planned`;
            
            panel.style.display = 'flex';
            list.innerHTML = '';
            
            if (!dayData.tasks || dayData.tasks.length === 0) {
                list.innerHTML = '<div class="empty-state">No tasks recorded for this day.</div>';
                return;
            }
            
            dayData.tasks.forEach(t => {
                const item = document.createElement('div');
                const isDelayed = t.delayed;
                item.className = 'task-item' + (t.status ? ' completed' : '') + (isDelayed ? ' delayed' : '');
                const badge = isDelayed ? `<span class="delay-badge">⏰ delayed_${t.delay_count}</span>` : '';
                item.innerHTML = `
                    <div class="checkbox"></div>
                    <div>${t.title}${badge}</div>
                `;
                list.appendChild(item);
            });
        }
    }
</script>

</body>
</html>
